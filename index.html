<!DOCTYPE html>
<html>
    <head>
        <title> South Africa Unemployment Dashboard </title>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
    </head>

    <body>

      <header>
        <h1> Unemployment in South Africa by Education Level and Gender</h1>
        <p>2017 to 2024 | Source: World Bank WDI </p>
        </header>
        
        <nav class="controls">

             <label for="SelectEducation">Education level:</label>
    <select id="SelectEducation">
      <option value="Advanced">Advanced</option>
      <option value="Intermediate">Intermediate</option>
      <option value="Basic">Basic</option>
    </select>


  </nav>
  <main>

  <section class="indicators">

    <div class="stats">
      <h3>Average unemployment over time</h3>
      <p class="percentage" id="avgRate">--</p>
    </div>

    <div class="stats">
      <h3>Highest unemployment year</h3>
      <p class="percentage" id="highestYear">--</p>
    </div>
  </section>
  <section class="charts">
      <div class="chart-box">
        <h3>Unemployment over time</h3>
        <canvas id="lineChart"></canvas>
      </div>

      <div class="chart-box">
        <h3>By education level</h3>
        <label for="SelectYear">Year:</label>
    <select id="SelectYear"></select>
        <canvas id="barChart"></canvas>
      </div>

      <div class="chart-box">
        <h3>Gender gap over time</h3>
        <canvas id="gapChart"></canvas>
      </div>
    </section>

</main>
     <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
     <script src="script.js"></script>
    </body>
</html>
